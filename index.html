<!DOCTYPE html>
<html lang="pt-BR" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wesley Melo - Helpdesk, sistemas e automação</title>
  <meta name="description" content="Portfólio de Wesley Melo: auxiliar de helpdesk e sistemas, aprendendo automação com n8n e programação.">
  <meta name="author" content="Wesley Melo">
  <meta name="theme-color" content="#0B0B0D">
  <meta property="og:type" content="website">
  <meta property="og:locale" content="pt_BR">
  <meta property="og:title" content="Wesley Melo - Helpdesk, sistemas e automação">
  <meta property="og:description" content="Helpdesk e sistemas no dia a dia, automação com n8n e programação em estudo.">
  <!-- O site abre sempre no escuro, antes de qualquer pintura da tela -->
  <script>document.documentElement.dataset.theme="dark";</script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
  <!-- ============================================================
    PORTFÓLIO · Wesley Melo · direção editorial monocromática
    Um único index.html. Sem Node, sem build, sem npm.
    CDN: React 18 + ReactDOM + Babel + Geist (com fallback de sistema).
    Ordem: Tokens → Base → Componentes → Dados → App
    Sistema: preto e branco. Sem cor decorativa. Um único acento
    (verde de status) usado como sinal, nunca como enfeite.
    Formato: 0px de raio em superfícies, pílula só em etiquetas.
  ============================================================ -->
  <style>
    /* ============ TOKENS ============ */
    :root{
      --paper:#F2F2F0; --paper-2:#E9E9E6; --paper-3:#E0E0DC;
      --surface:#FAFAF8;
      --ink:#0C0C0D; --ink-2:#43434A; --ink-3:#6B6B73;
      --line:rgba(12,12,13,.16); --line-soft:rgba(12,12,13,.09); --line-hard:rgba(12,12,13,.5);
      --inv-bg:#0C0C0D; --inv-ink:#F2F2F0;
      --menu:#FAFAF8; --badge-bg:#0C0C0D; --badge-fg:#F2F2F0;
      --status:#2E7D5B;
      --font:"Geist","SF Pro Text",-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
      --mono:"Geist Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
      --ease:cubic-bezier(.16,1,.3,1);
      --max:1180px; --nav-h:60px;
      --shadow:0 1px 2px rgba(12,12,13,.05);
    }
    [data-theme="dark"]{
      --paper:#0B0B0D; --paper-2:#17171A; --paper-3:#212125;
      --surface:transparent;
      --ink:#F1F1EE; --ink-2:#B4B4B8; --ink-3:#82828A;
      --line:rgba(241,241,238,.14); --line-soft:rgba(241,241,238,.08); --line-hard:rgba(241,241,238,.5);
      --inv-bg:#F1F1EE; --inv-ink:#0C0C0D;
      --menu:#141416; --badge-bg:#1F1F22; --badge-fg:#F1F1EE;
      --status:#5FBE92;
      --shadow:0 1px 2px rgba(0,0,0,.5);
    }

    /* ============ BASE ============ */
    *,*::before,*::after{box-sizing:border-box}
    html{scroll-behavior:smooth;scroll-padding-top:calc(var(--nav-h) + 20px)}
    body{
      margin:0;font-family:var(--font);background:var(--paper);color:var(--ink);
      -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;line-height:1.5;
      transition:background-color .4s var(--ease),color .4s var(--ease);
      animation:fade .35s var(--ease) both;
    }
    @keyframes fade{from{opacity:0}to{opacity:1}}
    ::selection{background:var(--ink);color:var(--paper)}
    a{color:inherit;text-decoration:none}
    :focus-visible{outline:2px solid var(--ink);outline-offset:3px}
    .skip{position:absolute;left:14px;top:-60px;z-index:400;background:var(--inv-bg);color:var(--inv-ink);
      padding:10px 18px;font-size:14px;font-weight:600;text-decoration:none;transition:top .2s var(--ease)}
    .skip:focus{top:12px}
    h1,h2,h3{letter-spacing:-.035em;line-height:1.04;margin:0;font-weight:600}
    p{margin:0}
    .wrap{max-width:var(--max);margin:0 auto;padding:0 28px}
    .mono{font-family:var(--mono);font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3)}
    .rule{height:1px;background:var(--line);transform-origin:0 50%}
    .lede{color:var(--ink-2);font-size:clamp(1rem,1.35vw,1.08rem);line-height:1.7;max-width:64ch}

    /* ============ FUNDO (malha técnica, sem brilho) ============ */
    .mesh{position:fixed;inset:0;z-index:0;pointer-events:none;opacity:.5;
      background-image:radial-gradient(circle at 1px 1px, var(--line) 1px, transparent 0);
      background-size:28px 28px;
      -webkit-mask-image:radial-gradient(120% 80% at 50% 0%, #000 0%, transparent 62%);
      mask-image:radial-gradient(120% 80% at 50% 0%, #000 0%, transparent 62%)}
    .site{position:relative;z-index:1}

    /* ============ NAV ============ */
    .nav{position:fixed;inset:0 0 auto 0;height:var(--nav-h);z-index:100;
      background:var(--paper);transition:background .3s var(--ease)}
    .nav-in{max-width:var(--max);margin:0 auto;padding:0 28px;height:var(--nav-h);
      display:flex;align-items:center;gap:20px}
    .brand{display:flex;align-items:center;gap:11px;text-decoration:none;font-weight:600;font-size:14.5px;letter-spacing:-.01em}
    .brand-mark{width:26px;height:26px;flex:none;border:0;display:inline-flex;
      align-items:center;justify-content:center;font-size:10.5px;font-weight:600;letter-spacing:.02em;
      transition:background .25s var(--ease),color .25s}
    .brand:hover .brand-mark{background:var(--inv-bg);color:var(--inv-ink)}
    .links{display:flex;gap:2px;list-style:none;margin:0;padding:0}
    .links a{text-decoration:none;font-size:13.5px;font-weight:450;color:var(--ink-2);padding:7px 13px;
      border-radius:2px;position:relative;transition:color .2s}
    .links a::after{content:"";position:absolute;left:13px;right:13px;bottom:4px;height:1px;background:currentColor;
      transform:scaleX(0);transform-origin:0 50%;transition:transform .3s var(--ease)}
    .links a:hover{color:var(--ink)}
    .links a:hover::after{transform:scaleX(1)}
    .nav-act{margin-left:auto;display:flex;align-items:center;gap:8px}
    /* controle segmentado: só o ícone/texto, sem fundo e sem quadrado */
    .seg{display:inline-flex;align-items:center;gap:2px}
    .seg button{position:relative;display:inline-flex;align-items:center;justify-content:center;
      min-width:34px;height:34px;padding:0 11px;background:none;border:0;color:var(--ink-3);
      font-family:var(--mono);font-size:11px;letter-spacing:.14em;cursor:pointer;
      transition:color .22s var(--ease)}
    .seg button:hover{color:var(--ink)}
    .seg button[aria-pressed="true"]{color:var(--ink)}
    .seg button[aria-pressed="true"]::after{content:"";position:absolute;left:50%;bottom:3px;
      width:3px;height:3px;border-radius:50%;background:var(--ink);transform:translateX(-50%)}
    .seg.seg-icon button{padding:0;width:33px}
    .seg svg{width:15px;height:15px;display:block}
    .tgl{border:0;background:none;color:var(--ink);width:34px;height:34px;cursor:pointer;
      display:inline-flex;align-items:center;justify-content:center;transition:background .2s,color .2s}
    .tgl:hover{background:var(--inv-bg);color:var(--inv-ink)}
    .burger{display:none}
    .m-panel{display:none}
    @media(max-width:720px){
      .links{display:none}
      .burger{display:inline-flex}
      .m-panel{display:block;position:fixed;top:var(--nav-h);left:16px;right:16px;z-index:99;
        background:var(--menu);border:0;padding:6px;
        opacity:0;transform:translateY(-6px);pointer-events:none;transition:opacity .22s var(--ease),transform .22s var(--ease)}
      .m-panel.open{opacity:1;transform:none;pointer-events:auto}
      .m-panel a{display:flex;justify-content:space-between;padding:13px 14px;text-decoration:none;font-size:15px;font-weight:500}
      .m-panel a:hover{background:var(--paper-2)}
      .m-panel a span:last-child{color:var(--ink-3);font-family:var(--mono);font-size:11px}
    }

    /* ============ BOTÕES (sem caixa, flutuam no texto) ============ */
    .btn{display:inline-flex;align-items:center;gap:10px;min-height:44px;padding:0 2px;
      font-size:14.5px;font-weight:550;text-decoration:none;cursor:pointer;border:0;
      background:none;white-space:nowrap;
      transition:color .22s var(--ease),opacity .22s var(--ease),transform .18s var(--ease)}
    .btn:active{transform:translateY(1px)}
    .btn-p{color:var(--ink)}
    .btn-p:hover{opacity:.66}
    .btn-g{color:var(--ink-3)}
    .btn-g:hover{color:var(--ink)}
    .btn .arw{transition:transform .25s var(--ease)}
    .btn:hover .arw{transform:translateX(3px)}
    .btn-row{display:flex;gap:26px;flex-wrap:wrap;margin-top:32px}

    /* ============ HERO (split editorial) ============ */
    .hero{padding:calc(var(--nav-h) + 64px) 0 0;position:relative}
    .hero-grid{display:grid;grid-template-columns:1.25fr .75fr;gap:64px;align-items:end}
    @media(max-width:940px){.hero-grid{grid-template-columns:1fr;gap:44px;align-items:start}}
    .kicker{display:flex;align-items:center;gap:12px;margin-bottom:26px}
    .kicker .dot{width:7px;height:7px;background:var(--status);border-radius:50%;flex:none}
    .hero h1{font-size:clamp(3.2rem,9vw,6.2rem);font-weight:600;letter-spacing:-.05em;line-height:.94}
    .hero h1 .l2{display:block;color:var(--ink-3)}
    .role{margin-top:24px;font-size:clamp(1rem,1.6vw,1.15rem);color:var(--ink);font-weight:500}
    .hero .lede{margin-top:12px;max-width:48ch}
    /* revelação por palavra (transform + opacity, sem recorte de glifos) */
    .mask{display:block}
    .mask .w{display:inline-block}
    .mask .wi{display:inline-block;transform:translateY(.42em);opacity:0;
      transition:transform .85s var(--ease),opacity .6s var(--ease)}
    .mask.in .wi{transform:none;opacity:1}
    .hero .mask .wi{transition-delay:calc(var(--i) * 55ms + 60ms)}
    .hero h1 .mask + .mask{margin-top:-.06em}
    /* nome digitado no carregamento: cursor piscando, glifos reservados invisíveis */
    .hero h1 .ghost{visibility:hidden}
    .hero .caret{display:inline-block;width:.075em;height:.78em;background:var(--ink);
      margin-left:.05em;transform:translateY(.04em);
      animation:caretBlink .9s steps(1) infinite}
    .hero h1 .l2 .caret{background:var(--ink-3)}
    .hero .caret.done{animation:caretBlink .9s steps(1) infinite, caretOut .5s var(--ease) 1.9s both}
    @keyframes caretBlink{0%,55%{opacity:1}56%,100%{opacity:0}}
    @keyframes caretOut{from{opacity:1}to{opacity:0}}

    /* painel de leitura (dado real, não enfeite) */
    .panel{background:var(--surface);padding:22px 22px 18px}
    .panel-h{display:flex;justify-content:flex-end;align-items:baseline;padding-bottom:10px}
    .panel dl{margin:0;display:grid;gap:0}
    .panel dl > div{display:flex;justify-content:space-between;align-items:baseline;gap:16px;
      padding:11px 0}
    .panel dt{font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3)}
    .panel dd{margin:0;font-size:13.5px;font-weight:500;text-align:right}
    .clock{font-family:var(--mono);font-size:13px;letter-spacing:.06em;font-variant-numeric:tabular-nums}

    /* ============ ESTRUTURA DE SEÇÃO ============ */
    section{padding:104px 0;position:relative}
    @media(max-width:768px){section{padding:68px 0}}
    .sec{display:grid;grid-template-columns:132px 1fr;gap:40px;align-items:start}
    @media(max-width:860px){.sec{grid-template-columns:1fr;gap:22px}}
    .sec-num{font-family:var(--mono);font-size:44px;line-height:1;color:var(--ink-3);
      letter-spacing:-.04em;user-select:none}
    [data-theme="dark"] .sec-num{color:var(--ink-3)}
    .sec h2{font-size:clamp(1.9rem,4vw,3rem);font-weight:600;letter-spacing:-.04em}
    .sec-head{margin-bottom:44px}
    .sec-head .lede{margin-top:16px}

    /* ============ SOBRE ============ */
    .about{display:grid;grid-template-columns:1fr;gap:0}
    .about .body{margin-top:20px;font-size:15.5px;color:var(--ink-2);line-height:1.7;max-width:62ch}

    /* ============ SKILLS (filtro real + níveis honestos) ============ */
    .filters{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:30px}
    .fchip{font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;
      border:0;background:var(--surface);color:var(--ink-2);padding:8px 14px;border-radius:2px;
      cursor:pointer;transition:background .2s,color .2s}
    .fchip:hover{color:var(--ink)}
    .fchip[aria-pressed="true"]{background:var(--inv-bg);color:var(--inv-ink)}
    .skills-list{}
    .skill{display:grid;grid-template-columns:52px 1.1fr 1.4fr 132px;gap:24px;align-items:center;
      padding:18px 12px;transition:background .28s var(--ease)}
    .skill:hover{background:var(--surface)}
    @media(max-width:860px){.skill{grid-template-columns:40px 1fr;gap:6px 14px;padding:16px 4px}
      .skill .s-cat{grid-column:2}.skill .s-meter{grid-column:2}}
    .skill .s-idx{font-family:var(--mono);font-size:11px;color:var(--ink-3)}
    .skill .s-name{font-size:15.5px;font-weight:550}
    .skill .s-cat{font-size:13.5px;color:var(--ink-2)}
    .skill .s-meter{display:flex;align-items:center;gap:10px;justify-content:flex-end}
    .ticks{display:flex;gap:4px;align-items:center}
    .ticks i{width:18px;height:4px;background:var(--paper-3);display:block}
    [data-theme="dark"] .ticks i{background:#26262B}
    .ticks i.on{background:var(--ink)}
    .skill.hidden{display:none}

    /* ============ PROJETOS (card em destaque) ============ */
    .proj{display:grid;gap:18px}
    .proj-card{display:grid;gap:26px}
    .proj-body{display:grid;grid-template-columns:1.25fr .75fr;gap:40px;align-items:start}
    @media(max-width:860px){.proj-body{grid-template-columns:1fr;gap:18px}}
    .proj-shot{margin:0;overflow:hidden}
    .proj-shot img{display:block;width:100%;height:auto}
    [data-theme="light"] .proj-shot img,
    [data-theme="light"] .proj-details img{filter:invert(1) hue-rotate(180deg)}
    .proj-name{font-size:clamp(1.35rem,2.4vw,1.75rem);font-weight:600;letter-spacing:-.03em;line-height:1.15}
    .proj-desc{margin-top:12px;font-size:15px;color:var(--ink-2);line-height:1.65;max-width:46ch}
    .proj-meta{display:flex;gap:12px;flex-wrap:wrap;margin-top:16px;align-items:center}
    .tag{font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;
      color:var(--ink-3);padding:0}
    .tag.concept{background:var(--badge-bg);color:var(--badge-fg);padding:5px 10px;border-radius:2px}
    .proj-cta{display:inline-flex;align-items:center;gap:9px;margin-top:22px;font-size:14px;font-weight:550;
      color:var(--ink);text-decoration:none;padding:0 0 3px;border:0;border-bottom:1px solid var(--line);background:none;
      font-family:inherit;cursor:pointer;
      transition:gap .2s var(--ease),border-color .2s}
    .proj-cta:hover{gap:13px;border-color:var(--ink)}
    .proj-cta .arw{transition:transform .2s var(--ease)}
    .proj-cta:hover .arw{transform:translateX(3px)}
    .proj-cta[aria-expanded="true" .arw]{transform:rotate(180deg)}

    /* detalhes do projeto (revelados no lugar) */
    .proj-details{margin-top:30px;padding-top:26px;border-top:1px solid var(--line)}
    .proj-details h4{font-size:1.05rem;font-weight:600;letter-spacing:-.02em;margin-bottom:6px}
    .proj-details .lede{font-size:14px;color:var(--ink-2)}
    /* carrossel das capturas (uma foto grande por vez, legenda em destaque) */
    .car{margin-top:6px}
    .car-frame{display:flex;justify-content:center;align-items:center}
    .car-img{display:block;width:min(560px,100%);height:auto;animation:carIn .45s var(--ease) both}
    .car-img.car-wide{width:100%}
    .car-foot{display:flex;justify-content:space-between;align-items:flex-start;gap:26px;margin-top:20px}
    .car-cap{display:grid;gap:9px;min-width:0}
    .car-num{font-family:var(--mono);font-size:11px;letter-spacing:.14em;color:var(--ink-3)}
    .car-title{font-size:clamp(18px,2.4vw,21px);font-weight:560;letter-spacing:-.015em;line-height:1.4;max-width:44ch;
      animation:carIn .45s var(--ease) .06s both}
    .car-nav{display:flex;gap:10px;flex-shrink:0;padding-top:8px}
    .car-nav button{width:50px;height:50px;background:transparent;color:var(--ink-2);border:0;cursor:pointer;
      font-family:var(--mono);font-size:18px;display:grid;place-items:center;
      transition:background .22s var(--ease),color .22s var(--ease),transform .22s var(--ease)}
    .car-nav button:hover{background:var(--inv-bg);color:var(--inv-ink);transform:translateY(-2px)}
    .car-nav button:active{transform:none}
    .car-dots{display:flex;gap:8px;margin-top:22px}
    .car-dots button{width:22px;height:14px;padding:0;border:0;background:none;cursor:pointer;display:grid;place-items:center}
    .car-dots i{width:14px;height:3px;background:var(--paper-3);display:block;transition:background .2s var(--ease),width .2s var(--ease)}
    [data-theme="dark"] .car-dots i{background:#1B1B1E}
    .car-dots button[aria-current="true"] i{background:var(--ink);width:20px}
    @media(max-width:620px){.car-foot{flex-direction:column;gap:16px}.car-nav{order:-1}}
    .proj-case{animation:carIn .45s var(--ease) .1s both}
    .proj-case{display:inline-flex;align-items:center;gap:8px;margin-top:24px;font-size:13.5px;font-weight:550;
      color:var(--ink);text-decoration:none;border-bottom:1px solid var(--line);padding-bottom:3px;
      transition:gap .2s var(--ease),border-color .2s}
    .proj-case:hover{gap:12px;border-color:var(--ink)}

    /* animação ao abrir e fechar os detalhes */
    @keyframes detailsIn{from{opacity:0;transform:translateY(-12px)}to{opacity:1;transform:none}}
    @keyframes carIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
    .proj-details{animation:detailsIn .42s var(--ease) both}

    /* ============ CONTATO (formulário + ícones soltos) ============ */
    .contact-grid{display:grid;grid-template-columns:1.25fr .75fr;gap:56px;align-items:start}
    @media(max-width:860px){.contact-grid{grid-template-columns:1fr;gap:34px}}
    .field{margin-bottom:26px}
    .field label{display:block;font-family:var(--mono);font-size:11px;letter-spacing:.14em;
      text-transform:uppercase;color:var(--ink-3);margin-bottom:10px}
    .field input,.field textarea{width:100%;background:transparent;border:0;
      border-bottom:1px solid var(--line);color:var(--ink);font:inherit;font-size:16px;
      padding:10px 0;transition:border-color .22s var(--ease)}
    .field textarea{resize:vertical;min-height:76px;line-height:1.6}
    .field input:focus,.field textarea:focus{outline:none;border-bottom-color:var(--ink)}
    .field input::placeholder,.field textarea::placeholder{color:var(--ink-3);opacity:.75}
    .form-note{margin-top:16px;font-size:12.5px;color:var(--ink-3);max-width:48ch;line-height:1.6}
    .contact-links{display:flex;gap:10px;align-items:center;margin-top:2px}
    .icon-btn{width:46px;height:46px;border:0;background:transparent;color:var(--ink-2);
      display:inline-flex;align-items:center;justify-content:center;cursor:pointer;
      transition:color .22s var(--ease),transform .22s var(--ease)}
    .icon-btn:hover{color:var(--ink);transform:translateY(-2px)}
    .icon-btn svg{width:22px;height:22px;display:block}
    .toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);z-index:300;
      background:var(--inv-bg);color:var(--inv-ink);font-size:13.5px;font-weight:500;
      padding:12px 22px;border-radius:2px;box-shadow:0 8px 30px rgba(12,12,13,.2);
      max-width:calc(100vw - 40px);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
      animation:toastIn .3s var(--ease) both}
    @keyframes toastIn{from{opacity:0;transform:translate(-50%,8px)}to{opacity:1;transform:translate(-50%,0)}}

    /* ============ RODAPÉ ============ */
    footer{padding:26px 0;position:relative;z-index:1}
    .foot{display:flex;gap:16px;flex-wrap:wrap;align-items:center;font-size:12.5px;color:var(--ink-3)}
    .foot .grow{flex:1}
    .foot a,.foot button{color:var(--ink-3);text-decoration:none;background:none;border:0;font-size:12.5px;
      cursor:pointer;padding:4px 0;font-family:inherit}
    .foot a:hover,.foot button:hover{color:var(--ink)}
    .foot .status{color:var(--status)}

    /* ============ REVEAL ============ */
    .rv{opacity:0;transform:translateY(18px);transition:opacity .7s var(--ease),transform .7s var(--ease)}
    .rv.in{opacity:1;transform:none}
    .rule.in{transform:scaleX(1)}
    .rule{transform:scaleX(0);transition:transform 1.1s var(--ease)}
    .progress{position:fixed;top:0;left:0;right:0;height:1px;z-index:150;background:var(--ink);
      transform:scaleX(0);transform-origin:0 50%}
    @supports (animation-timeline: scroll()){

    /* Título com revelação por máscara (palavra a palavra) */
    function MaskTitle({text, as:Tag="h2", className="", id}){
      const ref = useRef(null);
      useEffect(()=>{
        const el = ref.current; if(!el) return;
        if(window.matchMedia("(prefers-reduced-motion: reduce)").matches){ el.classList.add("in"); return; }
        const io = new IntersectionObserver(es=>es.forEach(e=>{
          if(e.isIntersecting){ el.classList.add("in"); io.disconnect(); }
        }),{threshold:.4});
        io.observe(el); return ()=>io.disconnect();
      },[]);
      return (
        <Tag ref={ref} id={id} className={"mask "+className}>
          {text.split(" ").map((w,i)=>(
            <span className="w" key={i}><span className="wi" style={{"--i":i}}>{w}&nbsp;</span></span>
          ))}
        </Tag>
      );
    }
    /* Nome da hero digitado sozinho ao abrir (sem deslocar o layout) */
    function TypeTitle({a="Wesley", b="Melo", id}){
      const total = a.length + b.length;
      const [n,setN] = useState(0);
      useEffect(()=>{
        if(window.matchMedia("(prefers-reduced-motion: reduce)").matches){ setN(total); return; }
        let iv;
        const t = setTimeout(()=>{
          iv = setInterval(()=> setN(x=>{
            if(x>=total){ clearInterval(iv); return total; }
            return x+1;
          }), 68);
        }, 420);
        return ()=>{ clearTimeout(t); if(iv) clearInterval(iv); };
      },[]);
      const na = Math.min(n, a.length);
      const nb = Math.max(0, Math.min(n - a.length, b.length));
      const done = n >= total;
      return (
        <h1 id={id} aria-label={a+" "+b}>
          <span className="l1" aria-hidden="true">
            {a.slice(0,na)}
            {na < a.length ? <span className="caret"></span> : null}
            <span className="ghost">{a.slice(na)}</span>
          </span>
          <span className="l2" aria-hidden="true">
            {b.slice(0,nb)}
            {na === a.length ? <span className={"caret"+(done?" done":"")}></span> : null}
            <span className="ghost">{b.slice(nb)}</span>
          </span>
        </h1>
      );
    }

        const el = ref.current; if(!el) return;
        if(window.matchMedia("(prefers-reduced-motion: reduce)").matches){ el.classList.add("in"); return; }
        const io = new IntersectionObserver(es=>es.forEach(e=>{
          if(e.isIntersecting){ el.classList.add("in"); io.disconnect(); }
        }),{threshold:.12});
        io.observe(el); return ()=>io.disconnect();
      },[]);
      return <Tag ref={ref} id={id} className={"rv "+className} style={{transitionDelay:delay+"ms"}}>{children}</Tag>;
    }

                  aria-expanded={menuOpen} aria-controls="menu-mobile" aria-label={menuOpen?t.nav.closeMenu:t.nav.openMenu}>
                  {menuOpen?"✕":"☰"}
                </button>
              </div>
            </div>
          </header>

          <div id="menu-mobile" className={"m-panel"+(menuOpen?" open":"")} hidden={!menuOpen}>
            <nav aria-label={t.nav.mobileNav}>
              {[["sobre",t.nav.sobre,"01"],["skills",t.nav.skills,"02"],["projetos",t.nav.projetos,"03"],["contato",t.nav.contato,"04"]].map(([id,l,n])=>(
                <a key={id} href={"#"+id} onClick={()=>setMenuOpen(false)}>{l}<span>{n}</span></a>
              ))}
            </nav>
          </div>

          <div className="site">
          <main id="conteudo">
            {/* ===== HERO ===== */}
            <section className="hero" id="inicio" aria-labelledby="hero-title">
              <div className="wrap">
                <div className="hero-grid">
                  <div>
                    <p className="kicker"><span className="dot" aria-hidden="true"/><span className="mono">{t.hero.kicker}</span></p>
                    <TypeTitle/>
                    <p className="role">{t.hero.role}</p>
                    <p className="lede">{t.hero.lede}</p>
                    <div className="btn-row">
                      <a className="btn btn-p" href="#projetos">{t.hero.cta1} <span className="arw" aria-hidden="true">↓</span></a>
                      <a className="btn btn-g" href="#contato">{t.hero.cta2} <span className="arw" aria-hidden="true">→</span></a>
                    </div>
                  </div>

                  <aside className="panel" aria-label={t.panel.title}>
                    <div className="panel-h">
                      <span className="clock">{clock}</span>
                    </div>
                    <dl>
                      <div><dt>{t.panel.foco}</dt><dd>{t.panel.focoVal}</dd></div>
                      <div><dt>{t.panel.base}</dt><dd>{t.panel.baseVal}</dd></div>
                      <div><dt>{t.panel.estuda}</dt><dd>{t.panel.estudaVal}</dd></div>
                      <div><dt>{t.panel.interesse}</dt><dd>{t.panel.interesseVal}</dd></div>
                    </dl>
                  </aside>
                </div>

              </div>
            </section>

            {/* ===== PROJETOS ===== */}
            <section id="projetos" aria-labelledby="projetos-title">
              <div className="wrap">
                <div className="sec">
                  <div className="sec-num" aria-hidden="true">01</div>
                  <div>
                    <div className="sec-head">
                      <MaskTitle text={t.projects.title} id="projetos-title"/>
                      <p className="lede">{t.projects.lede}</p>
                    </div>
                    <div className="proj">
                      {PROJECTS.map((p,i)=>{
                        const pc = (PROJECT_COPY[lang] || PROJECT_COPY.pt)[p.key];
                        const aberto = openProject === p.key;
                        return (
                        <Reveal key={p.key} delay={i*60}>
                          <article className="proj-card">
                            <figure className="proj-shot">
                              <img src={p.shot} alt={pc.shotAlt} width="940" height="152" loading="lazy" decoding="async"/>
                            </figure>
                            <div className="proj-body">
                              <div>
                                <h3 className="proj-name">{pc.name}</h3>
                                <p className="proj-desc">{pc.desc}</p>
                              </div>
                              <div>
                                <div className="proj-meta">
                                  <span className="tag concept">{pc.badge || t.projects.demo}</span>
                                  {p.tech.map(x=>(<span className="tag" key={x}>{x}</span>))}
                                </div>
                                <button type="button" className="proj-cta"
                                  onClick={()=>setOpenProject(aberto ? null : p.key)}
                                  aria-expanded={aberto}
                                  aria-controls={"proj-detalhes-"+p.key}>
                                  {aberto ? t.projects.hideDetails : t.projects.details} <span className="arw" aria-hidden="true">↓</span>
                                </button>
                              </div>
                            </div>
                          </article>

                          {aberto && (
                            <div className="proj-details" id={"proj-detalhes-"+p.key}>
                              <h4>{t.projects.shotsTitle}</h4>
                              <p className="lede">{t.projects.shotsLede}</p>
                              <ShotCarousel items={t.projects.shots}
                                labels={{title:t.projects.shotsTitle, prev:t.projects.prevShot, next:t.projects.nextShot}}/>
                              <a className="proj-case" href={p.demo}>
                                {t.projects.caseLink} <span aria-hidden="true">→</span>
                              </a>
                            </div>
                          )}
                        </Reveal>
                        );
                      })}
                    </div>
                    <Reveal delay={80}>
                      <p className="lede" style={{marginTop:"28px",fontSize:"14px"}}>
                        {t.projects.foot}
                      </p>
                    </Reveal>
                  </div>
                </div>
              </div>
            </section>

            {/* ===== SOBRE ===== */}
            <section id="sobre" aria-labelledby="sobre-title">
              <div className="wrap">
                <div className="sec">
                  <div className="sec-num" aria-hidden="true">02</div>
                  <div>
                    <div className="sec-head">
                      <MaskTitle text={t.about.title} id="sobre-title"/>
                      <p className="lede">{t.about.lede}</p>
                    </div>
                    <div className="about">
                      <div>
                        <p className="lede">{t.about.p1}</p>
                        <p className="body">{t.about.p2}</p>
                      </div>
                    </div>
                  </div>
                </div>
              </div>
            </section>

            {/* ===== HABILIDADES ===== */}
            <section id="skills" aria-labelledby="skills-title">
              <div className="wrap">
                <div className="sec">
                  <div className="sec-num" aria-hidden="true">03</div>
                  <div>
                    <div className="sec-head">
                      <MaskTitle text={t.skills.title} id="skills-title"/>
                      <p className="lede">{t.skills.lede}</p>
                    </div>
                    <Rule/>
                    <div className="filters" role="group" aria-label={t.skills.filterLabel}>
                      {cats.map(c=>(
                        <button key={c} type="button" className="fchip" aria-pressed={filter===c} onClick={()=>setFilter(c)}>
                          {c==="todos" ? t.skills.all : tCats[c]}
                        </button>
                      ))}
                    </div>
                    <div className="skills-list">
                      {shown.map((s,i)=>(
                        <Reveal className="skill" key={s.n} delay={Math.min(i*45,320)}>
                          <span className="s-idx">{String(i+1).padStart(2,"0")}</span>
                          <span className="s-name">{lang==="en" && s.nEn ? s.nEn : s.n}</span>
                          <span className="s-cat">{tCats[s.cat]}</span>
                          <span className="s-meter">
                            <span className="ticks" role="img" aria-label={t.skills.level+": "+s.lvl+" "+t.skills.levelOf}>
                              {[0,1,2,3].map(k=>(<i key={k} className={k<s.lvl?"on":""}/>))}
                            </span>
                          </span>
                        </Reveal>
                      ))}
                    </div>
                  </div>
                </div>
              </div>
            </section>

            {/* ===== CONTATO ===== */}
            <section id="contato" aria-labelledby="contato-title">
              <div className="wrap">
                <div className="sec">
                  <div className="sec-num" aria-hidden="true">04</div>
                  <div>
                    <div className="sec-head">
                      <MaskTitle text={t.contact.title} id="contato-title"/>
                      <p className="lede">{t.contact.lede}</p>
                    </div>
                    <div className="contact-grid">
                      <form className="contact-form" onSubmit={sendMessage}>
                        <div className="field">
                          <label htmlFor="ct-name">{t.contact.nameLabel}</label>
                          <input id="ct-name" name="name" type="text" required
                            placeholder={t.contact.namePlaceholder} autoComplete="name"/>
                        </div>
                        <div className="field">
                          <label htmlFor="ct-msg">{t.contact.msgLabel}</label>
                          <textarea id="ct-msg" name="message" rows="3"
                            placeholder={t.contact.msgPlaceholder}></textarea>
                        </div>
                        <button className="btn btn-p" type="submit">{t.contact.send} <span className="arw" aria-hidden="true">→</span></button>
                        <p className="form-note">{t.contact.formNote}</p>
                      </form>

                      <div className="contact-links">
                        <button type="button" className="icon-btn" onClick={copyEmail} aria-label={t.contact.copyAria} title={t.contact.copyAria}>
                          {copied ? <Icon d={P.check} s={20}/> : <Icon d={P.mail} s={20}/>}
                        </button>
                        <a className="icon-btn" href="https://github.com/wsmelo-dev" target="_blank" rel="noopener noreferrer" aria-label={t.contact.githubAria} title={t.contact.githubAria}>
                          <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 .297c-6.63 0-12 5.373-12 12 0 5.303 3.438 9.8 8.205 11.385.6.113.82-.258.82-.577 0-.285-.01-1.04-.015-2.04-3.338.724-4.042-1.61-4.042-1.61C4.422 18.07 3.633 17.7 3.633 17.7c-1.087-.744.084-.729.084-.729 1.205.084 1.838 1.236 1.838 1.236 1.07 1.835 2.809 1.305 3.495.998.108-.776.417-1.305.76-1.605-2.665-.3-5.466-1.332-5.466-5.93 0-1.31.465-2.38 1.235-3.22-.135-.303-.54-1.523.105-3.176 0 0 1.005-.322 3.3 1.23.96-.267 1.98-.399 3-.405 1.02.006 2.04.138 3 .405 2.28-1.552 3.285-1.23 3.285-1.23.645 1.653.24 2.873.12 3.176.765.84 1.23 1.91 1.23 3.22 0 4.61-2.805 5.625-5.475 5.92.42.36.81 1.096.81 2.22 0 1.606-.015 2.896-.015 3.286 0 .315.21.69.825.57C20.565 22.092 24 17.592 24 12.297c0-6.627-5.373-12-12-12"/></svg>
                        </a>
                        <a className="icon-btn" href="https://www.linkedin.com/in/wesley-melo-b10681445" target="_blank" rel="noopener noreferrer" aria-label={t.contact.linkedinAria} title={t.contact.linkedinAria}>
                          <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M20.447 20.452h-3.554v-5.569c0-1.328-.027-3.037-1.852-3.037-1.853 0-2.136 1.445-2.136 2.939v5.667H9.351V9h3.414v1.561h.046c.477-.9 1.637-1.85 3.37-1.85 3.601 0 4.267 2.37 4.267 5.455v6.286zM5.337 7.433c-1.144 0-2.063-.926-2.063-2.065 0-1.138.92-2.063 2.063-2.063 1.14 0 2.064.925 2.064 2.063 0 1.139-.925 2.065-2.064 2.065zm1.782 13.019H3.555V9h3.564v11.452zM22.225 0H1.771C.792 0 0 .774 0 1.729v20.542C0 23.227.792 24 1.771 24h20.451C23.2 24 24 23.227 24 22.271V1.729C24 .774 23.2 0 22.225 0z"/></svg>
                        </a>
                      </div>
                    </div>
                    <input id="email-fallback" hidden readOnly value={EMAIL}
                      onFocus={(e)=>e.target.select()} aria-label={t.contact.copyAria}/>
                  </div>
                </div>
              </div>
            </section>
          </main>

          <footer>
            <div className="wrap foot">
              <span>© 2026 Wesley Melo</span>
              <span className="mono status">{t.footer.status}</span>
              <span className="grow"/>
              <a href="#inicio">{t.footer.top} <span aria-hidden="true">↑</span></a>
            </div>
          </footer>
          </div>

          {toast && <div className="toast" role="status">{toast}</div>}
        </React.Fragment>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
  </script>
</body>
</html>
